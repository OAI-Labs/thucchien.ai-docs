name: Vercel Preview

# Mỗi PR (mở mới hoặc push thêm) được build và deploy một bản preview lên Vercel,
# link preview được comment vào PR. Production vẫn là GitHub Pages (jekyll-gh-pages.yml).
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Push liên tiếp vào cùng một PR thì huỷ bản đang chạy, chỉ giữ bản mới nhất.
concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # ID không phải bí mật (lấy từ .vercel/project.json); chỉ VERCEL_TOKEN là secret.
  VERCEL_ORG_ID: team_1FIzrhd7H64Ls6tNSRFZexJ2
  VERCEL_PROJECT_ID: prj_C2dvZdCpFs7HgWRPPkPyywMNAUd6
  # Vercel CLI tự đọc biến này, không cần truyền --token.
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Deploy preview
    # PR từ fork không có quyền đọc secret nên bỏ qua.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check VERCEL_TOKEN
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN trống hoặc chưa được thêm vào repo."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview
      - name: Build
        run: vercel build
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Vercel preview:** $URL (commit \`${SHA:0:7}\`)"
